<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>Lantern MVP</title><link rel="icon" href="data:,">
<style>
:root{--bg:#070707;--iv:#f4efe5;--gold:#d9a343;--g2:#f2c66c;--mut:#a9adb5;--line:rgba(244,239,229,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--iv);font-family:Arial,sans-serif}.shell{min-height:100vh;display:flex;justify-content:center;padding:22px}.panel{width:min(920px,100%);border:1px solid var(--line);border-radius:28px;padding:28px;background:var(--bg)}.logo{display:block;width:min(520px,95%);margin:auto;border-radius:0;background:var(--bg)}h1{font-weight:400;font-size:clamp(30px,5vw,52px)}.lead{color:#d8d3ca;line-height:1.7}.center{text-align:center}.ey{margin-top:23px;color:var(--g2);font-size:12px;letter-spacing:.15em}.pills,.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.pill,.btn,.mode{border-radius:999px;padding:11px 16px;cursor:pointer}.pill,.mode,.ghost{background:#0d1723;color:var(--iv);border:1px solid var(--line)}.primary{background:linear-gradient(#f0c873,#d9a343);color:#111722;border:0;font-weight:700}.pill.active,.mode.active{border-color:var(--gold);color:#ffd98c}textarea,input,select{width:100%;background:#0b111a;color:var(--iv);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.finding{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.light{width:16px;height:16px;border-radius:50%;background:var(--g2);box-shadow:0 0 48px 18px rgba(217,163,67,.3);margin:22px;animation:p 2s infinite}@keyframes p{50%{transform:scale(1.2)}}.story{font:19px/1.9 Georgia,serif;max-width:780px;margin:auto}.story p{margin-bottom:1.2em}.tag,.meta{font-size:12px}.tag{color:var(--g2);letter-spacing:.14em}.meta{color:var(--mut)}.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:#0b111a}.nav{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}.silence{text-align:center;margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}.feedback{color:var(--g2);min-height:22px;margin-top:10px}
.finding-copy{min-height:74px;max-width:680px;display:flex;align-items:center;justify-content:center}
.finding-copy.glow-in{animation:lanternGlowIn .8s ease forwards}

@keyframes lanternGlowIn{0%{opacity:0;filter:blur(7px);text-shadow:0 0 0 rgba(242,198,108,0)}100%{opacity:1;filter:blur(0);text-shadow:0 0 22px rgba(242,198,108,.16)}}
@keyframes lanternGlowOut{0%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(7px)}}
.story-experience{max-width:780px;margin:34px auto 0}
.story-beat{font:19px/1.9 Georgia,serif;margin:0 auto;padding:30px 0 46px;max-width:720px}

.exit-choice{justify-content:center;margin-top:18px}
.resonance-panel{display:none;opacity:0;transition:opacity .35s ease}
.resonance-panel.show{display:block;opacity:1}
.close-screen{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.account-grid .full{grid-column:1/-1}

.account-chip{font-size:12px;color:var(--g2);border:1px solid var(--line);border-radius:999px;padding:9px 12px}
@media(max-width:700px){.account-grid{grid-template-columns:1fr}.account-grid .full{grid-column:auto}.audio-row select{width:100%}.volume{width:100%}}
.toggle{display:flex;gap:8px;align-items:center;margin-top:15px}.toggle input{width:auto;margin:0}@media(max-width:700px){.shell{padding:0}.panel{min-height:100vh;border-radius:0;border-left:0;border-right:0;padding:18px}.story{font-size:18px}}

@keyframes quietBreath{0%,100%{transform:scale(.88);opacity:.45}50%{transform:scale(1.08);opacity:.85}}

.audio-console{position:relative}
.audio-status{line-height:1.5}

.reader-pull{font:clamp(27px,4vw,42px)/1.35 Georgia,serif;color:#f2eadb;margin:70px 0;padding-left:28px;border-left:1px solid var(--g2)}

</style></head><body><main id="app"></main><script>
const app=document.querySelector('#app');
const guestUid=localStorage.lantern_uid||(localStorage.lantern_uid='u-'+crypto.randomUUID());
let adminToken=localStorage.lantern_admin_token||'';
let authSession={access_token:localStorage.lantern_access_token||'',refresh_token:localStorage.lantern_refresh_token||'',expires_at:Number(localStorage.lantern_auth_expires_at||0),user:JSON.parse(localStorage.lantern_auth_user||'null')};
let S={screen:'ritual',path:null,moment:'',story:null,profile:null,mode:'read',private:false,recent:JSON.parse(localStorage.lantern_recent||'[]'),recentTitles:JSON.parse(localStorage.lantern_recent_titles||'[]'),recentFingerprints:JSON.parse(localStorage.lantern_recent_fingerprints||'[]'),me:null,authDraft:null,exitChoice:null};
function saveAuthSession(d){
  if(d.access_token){authSession.access_token=d.access_token;localStorage.lantern_access_token=d.access_token}
  if(d.refresh_token){authSession.refresh_token=d.refresh_token;localStorage.lantern_refresh_token=d.refresh_token}
  if(d.user){authSession.user=d.user;localStorage.lantern_auth_user=JSON.stringify(d.user)}
  const exp=Date.now()+Number(d.expires_in||3600)*1000;authSession.expires_at=exp;localStorage.lantern_auth_expires_at=String(exp)
}
function clearAuthSession(){authSession={access_token:'',refresh_token:'',expires_at:0,user:null};['lantern_access_token','lantern_refresh_token','lantern_auth_expires_at','lantern_auth_user'].forEach(k=>localStorage.removeItem(k))}
async function refreshSession(){
  if(!authSession.refresh_token)return false;
  try{let r=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authSession.refresh_token})});let d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Session expired');saveAuthSession(d);return true}catch(e){clearAuthSession();return false}
}
async function restoreSession(){if(authSession.refresh_token&&(!authSession.access_token||Date.now()>authSession.expires_at-120000))await refreshSession()}
async function api(url,opt={}){
  if(authSession.refresh_token&&Date.now()>authSession.expires_at-120000)await refreshSession();
  opt.headers={'Content-Type':'application/json','X-Lantern-User':guestUid,...(opt.headers||{})};
  if(authSession.access_token)opt.headers['Authorization']='Bearer '+authSession.access_token;
  if(adminToken)opt.headers['X-Lantern-Admin-Token']=adminToken;
  let r=await fetch(url,opt),text=await r.text(),data={};try{data=text?JSON.parse(text):{}}catch(e){data={error:text||('HTTP '+r.status)}}
  if(!r.ok)throw new Error(data.detail||data.error||data.message||('HTTP '+r.status));return data
}
async function loadMe(){
  await restoreSession();S.me=await api('/api/me');if(S.me?.prefs?.mode)S.mode=S.me.prefs.mode;
  if(Array.isArray(S.me?.recent)&&S.me.recent.length){const ids=S.me.recent.map(x=>x.story_id).filter(Boolean),titles=S.me.recent.map(x=>x.title).filter(Boolean);S.recent=[...new Set([...ids,...S.recent])].slice(0,20);S.recentTitles=[...new Set([...titles,...S.recentTitles])].slice(0,20)}
}
const groups=[['FOR WHAT’S AHEAD',['Prepare Me']],['FOR WHAT YOU’RE CARRYING',['Encourage Me','Comfort Me','Calm Me']],['FOR GROWTH & DISCOVERY',['Inspire Me','Teach Me','Connect Me']]];
const shell=x=>app.innerHTML=`<div class="shell"><section class="panel">${x}</section></div>`;const logo=()=>`<img class="logo" src="/lantern-logo.jpg" alt="Lantern">`;
async function loadMe(){S.me=await api('/api/me')}
function ritual(){shell(`<div class=center>${logo()}<h1>Every person carries a story.</h1><p class=lead>Let’s find the one you need today.</p><button class="btn primary" id=enterLantern>Enter Lantern</button><div id=startError class=feedback></div></div>`);
  document.getElementById('enterLantern').onclick=async()=>{
    const btn=document.getElementById('enterLantern'),err=document.getElementById('startError');
    btn.disabled=true;btn.textContent='Opening Lantern…';err.textContent='';
    try{await loadMe();S.screen='home';render()}
    catch(e){btn.disabled=false;btn.textContent='Enter Lantern';err.textContent=e.message||'Lantern could not open. Please try again.'}
  }
}
function nav(){
  const acct=S.me?.authenticated?`<button class="btn ghost" id=accountBtn>${escapeHtml(S.me?.profile?.first_name||'Account')}</button>`:'<button class="btn ghost" id=accountBtn>Sign in</button>';
  return `<div class=nav><button class="btn ghost" id=lib>Library</button><button class="btn ghost" id=prefs>Preferences</button>${acct}${adminToken?'<button class="btn ghost" id=adminPanelBtn>Admin Test</button>':'<button class="btn ghost" id=adminLoginBtn>Admin</button>'}</div>`
}
function bindNav(){
  const libBtn=document.getElementById('lib'),prefsBtn=document.getElementById('prefs'),accountBtn=document.getElementById('accountBtn'),adminLoginBtn=document.getElementById('adminLoginBtn'),adminPanelBtn=document.getElementById('adminPanelBtn');
  if(libBtn)libBtn.onclick=async()=>{await loadMe();S.screen='library';render()};
  if(prefsBtn)prefsBtn.onclick=async()=>{await loadMe();S.screen='prefs';render()};
  if(accountBtn)accountBtn.onclick=()=>{S.screen=S.me?.authenticated?'account':'signin';render()};
  if(adminLoginBtn)adminLoginBtn.onclick=()=>{S.screen='adminLogin';render()};
  if(adminPanelBtn)adminPanelBtn.onclick=()=>{S.screen='adminPanel';render()}
}
function home(){let ent=S.me?.entitlement; shell(`${nav()}${logo()}<h1>What brings you here today?</h1>${S.me?.authenticated&&S.me?.profile?.first_name?`<p class=meta>Welcome back, ${escapeHtml(S.me.profile.first_name)}.</p>`:''}<textarea id=m placeholder="Tell Lantern what’s happening...">${S.moment}</textarea>${groups.map(([g,a])=>`<div class=ey>${g}</div><div class=pills>${a.map(x=>`<button class="pill ${S.path===x?'active':''}" data-p="${x}">${x}</button>`).join('')}</div>`).join('')}<div class=ey>OR LET LANTERN CHOOSE</div><div class=pills><button class=pill data-p="Surprise Me">Surprise Me</button><button class=pill id=quiet>Just stay quiet with me</button></div><label class=toggle><input type=checkbox id=priv ${S.private?'checked':''}> Just This Moment <span class=meta>— don’t add this experience to history.</span></label><div class=row><button class="btn primary" id=find>Find my story</button><button class="btn ghost" id=sod>Story of the Day</button></div><p class=meta>${ent?.state==='paid'?`Paid · ${ent.full_remaining} Full Lantern Moments remaining this month · curated unlimited`:ent?.state==='free'?`Free · ${ent.curated_remaining} curated this week · ${ent.full_remaining} Full Lantern Moment this month`:`Guest · ${ent?.full_remaining??2} Full Lantern Moments before registration`}</p><div id=err class=feedback></div>`);bindNav();
const momentEl=document.getElementById('m');
const privateEl=document.getElementById('priv');
const findEl=document.getElementById('find');
const quietEl=document.getElementById('quiet');
const sodEl=document.getElementById('sod');
const errEl=document.getElementById('err');
document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{
  S.moment=momentEl.value;S.path=x.dataset.p;S.kind=(S.path==='Surprise Me'?'curated':'full');
  document.querySelectorAll('[data-p]').forEach(p=>p.classList.toggle('active',p.dataset.p===S.path));
});
momentEl.oninput=e=>{S.moment=e.target.value;S.kind=(S.path==='Surprise Me'?'curated':'full')};
privateEl.onchange=e=>S.private=e.target.checked;
findEl.onclick=()=>{S.moment=momentEl.value.trim();if(S.moment||S.path){getStory()}else{errEl.textContent='Tell Lantern what is happening or choose a pathway first.'}};
quietEl.onclick=()=>{S.screen='quiet';render()};
sodEl.onclick=async()=>{let d=await api('/api/story-of-day');if(!d.entitlement.curated_allowed){errEl.textContent='Story of the Day counts as your weekly free story, and this week’s story has already been used.';return}S.path=d.preview.pathway;S.moment='Story of the Day';S.kind='curated';getStory()}}
async function getStory(){
  S.screen='finding';render(); const started=Date.now();
  try{let d=await api('/api/light',{method:'POST',body:JSON.stringify({moment:S.moment,pathway:S.path,recent:S.recent,recent_titles:S.recentTitles,recent_fingerprints:S.recentFingerprints,just_this_moment:S.private,experience_kind:S.kind||'full'})});
    stopFindingCopy();
    const wait=Math.max(0,1800-(Date.now()-started)); if(wait) await new Promise(r=>setTimeout(r,wait));
    if(d.status==='limit'){S.limitKind=d.kind;S.screen='limit';render();return}
    if(d.status==='clarify'){S.question=d.question;S.screen='clarify';render();return}
    if(d.status==='no_match'){S.noMatch=d;S.screen='nomatch';render();return}
    if(d.story){S.story=d.story;S.profile=d.profile;if(d.entitlement&&S.me)S.me.entitlement=d.entitlement;S.recent=[d.story.id,...S.recent.filter(x=>x!==d.story.id)].slice(0,12);S.recentTitles=[d.story.title,...S.recentTitles.filter(x=>x!==d.story.title)].slice(0,12);if(d.story.fingerprint)S.recentFingerprints=[d.story.fingerprint,...S.recentFingerprints.filter(x=>x!==d.story.fingerprint)].slice(0,12);localStorage.lantern_recent=JSON.stringify(S.recent);localStorage.lantern_recent_titles=JSON.stringify(S.recentTitles);localStorage.lantern_recent_fingerprints=JSON.stringify(S.recentFingerprints);S.screen='story';render();return}
    throw new Error('Lantern did not receive a story.');
  }catch(e){stopFindingCopy();S.screen='home';render();const errorBox=document.getElementById('err');if(errorBox)errorBox.textContent='Lantern could not find your story: '+e.message;}
}
let findingCopyTimer=null;
const findingCopy={
  'Prepare Me':[
    'Some moments ask us to step forward before we feel completely ready.',
    'Preparation does not always arrive as confidence.',
    'Sometimes the next step becomes clearer only after we begin.',
    'There are stories about meeting uncertainty without pretending it is gone.',

  'Encourage Me':[

function stopFindingCopy(){if(findingCopyTimer){clearTimeout(findingCopyTimer);findingCopyTimer=null}}

function escapeHtml(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function storyReadingMarkup(text){
  const paras=String(text||'').split(/\n\n+/).map(x=>x.trim()).filter(Boolean);
  if(!paras.length)return '';
  const groups=[]; const size=paras.length<=6?2:paras.length<=12?3:4;
  for(let i=0;i<paras.length;i+=size)groups.push(paras.slice(i,i+size));
  return groups.map((g,idx)=>{
    const phase=idx===0?'opening':idx===groups.length-1?'landing':idx===Math.floor(groups.length*.6)?'turn':'';
    let body=g.map((p,j)=>{
      const words=p.split(/\s+/).length;

    }).join('');

  }).join('');
}
async function completeStoryExit(choice){

let speechAudio=null,speechUrls=[],narrationStopped=false;
let ambienceDecks=[],ambienceTimer=null,ambienceGeneration=0;
function stopNarration(){narrationStopped=true;if(speechAudio){try{speechAudio.pause();speechAudio.currentTime=0}catch(e){}speechAudio=null}speechUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});speechUrls=[]}
function stopAmbience(){
  ambienceGeneration++;if(ambienceTimer){clearTimeout(ambienceTimer);ambienceTimer=null}
  ambienceDecks.forEach(a=>{try{a.pause();a.src=''}catch(e){}});ambienceDecks=[]
}
function soundPalette(){
  const p=S.profile?.sound_palette;
  const map={warm_piano:'soft_music',soft_strings:'soft_music',night_air:'night_room',rain_piano:'rain_music',open_horizon:'open_air'};
  return map[p]||((S.profile?.pathway||S.path)==='Calm Me'?'rain_music':(S.profile?.pathway||S.path)==='Comfort Me'?'soft_music':'open_air')
}
function soundUrl(){
  const p=soundPalette();
  const files={soft_music:'/ambience/soft_music.wav',rain_music:'/ambience/rain_music.wav',night_room:'/ambience/night_room.wav',open_air:'/ambience/open_air.wav'};
  return files[p]||files.soft_music
}
function fadeAudio(a,from,to,ms,onDone){
  const steps=24,step=ms/steps;let i=0;a.volume=from;
  const timer=setInterval(()=>{i++;a.volume=Math.max(0,Math.min(1,from+(to-from)*(i/steps)));if(i>=steps){clearInterval(timer);if(onDone)onDone()}},step)
}
function startAmbience(volume=.10){
  stopAmbience();const generation=ambienceGeneration,src=soundUrl(),cross=3500;
  const makeDeck=()=>{const a=new Audio(src);a.preload='auto';a.volume=0;return a};
  let active=makeDeck(),standby=makeDeck();ambienceDecks=[active,standby];
  const schedule=()=>{
    if(generation!==ambienceGeneration)return;
    const remaining=Math.max(5,(active.duration||20)-(active.currentTime||0));
    ambienceTimer=setTimeout(async()=>{
      if(generation!==ambienceGeneration)return;
      try{standby.currentTime=0;standby.volume=0;await standby.play();fadeAudio(standby,0,volume,cross);fadeAudio(active,volume,0,cross,()=>{try{active.pause()}catch(e){}});[active,standby]=[standby,active];schedule()}catch(e){}
    },Math.max(1000,remaining*1000-cross))
  };
  active.addEventListener('loadedmetadata',schedule,{once:true});
  active.play().then(()=>fadeAudio(active,0,volume,1800)).catch(()=>{})
}
function splitNarration(text,max=2500){
  const paras=String(text||'').split(/\n\n+/).filter(Boolean),out=[];let cur='';
  for(const p of paras){if((cur+'\n\n'+p).length<=max)cur=cur?cur+'\n\n'+p:p;else{if(cur)out.push(cur);cur=p}}
  if(cur)out.push(cur);return out
}
async function fetchSpeechSegment(text,voice){
  await restoreSession();const headers={'Content-Type':'application/json','X-Lantern-User':guestUid};
  if(authSession.access_token)headers['Authorization']='Bearer '+authSession.access_token;if(adminToken)headers['X-Lantern-Admin-Token']=adminToken;
  const r=await fetch('/api/audio/speech',{method:'POST',headers,body:JSON.stringify({text,voice,profile:S.profile||{}})});
  if(!r.ok){let d={};try{d=await r.json()}catch(e){}throw new Error(d.error||'Narration could not be generated.')}return await r.blob()
}
async function startNarration(voice,statusEl,withAmbience=true,onSegment=null,onReady=null){
  stopNarration();narrationStopped=false;
  const parts=splitNarration(S.story.text,1700),cache=new Map();let idx=0;
  const getPart=i=>{if(!cache.has(i))cache.set(i,fetchSpeechSegment(parts[i],voice));return cache.get(i)};
  if(!parts.length)return;
  // Safety buffer: do not start on a single lucky chunk. Prepare two chunks first.
  if(statusEl)statusEl.textContent='Opening the story…';
  const initial=Math.min(2,parts.length);
  const firstBlobs=await Promise.all(Array.from({length:initial},(_,i)=>getPart(i)));
  if(narrationStopped)return;
  if(withAmbience)startAmbience(.075);
  if(onReady)onReady();
  firstBlobs.forEach((b,i)=>cache.set(i,Promise.resolve(b)));
  if(parts.length>initial)getPart(initial);
  const playNext=async()=>{
    if(narrationStopped)return;
    if(idx>=parts.length){
      if(statusEl)statusEl.textContent='Story complete.';
      // Let the score hold briefly, then resolve instead of looping forever.
      setTimeout(()=>stopAmbience(),4500);
      return
    }
    try{
      const current=idx,blob=await getPart(current);if(narrationStopped)return;idx++;
      if(idx+1<parts.length)getPart(idx+1);
      const url=URL.createObjectURL(blob);speechUrls.push(url);speechAudio=new Audio(url);speechAudio.volume=1;
      speechAudio.onplay=()=>{if(statusEl)statusEl.textContent='Listening…';if(onSegment)onSegment(current,parts.length)};
      speechAudio.onended=()=>setTimeout(playNext,500);
      speechAudio.onerror=()=>{if(statusEl)statusEl.textContent='Narration stopped unexpectedly.';stopAmbience()};
      await speechAudio.play()
    }catch(e){if(statusEl)statusEl.textContent=e.message;stopAmbience()}
  };await playNext()
}

function register(){
  shell(`${logo()}<h1>Make Lantern yours.</h1><p class=lead>So your stories, reflections and preferences can travel with you.</p><div class=account-grid><div><label>First name<input id=regFirst autocomplete=given-name placeholder="First name"></label></div><div><label>Email<input id=regEmail type=email autocomplete=email placeholder="you@example.com"></label></div><div class=full><label>Country${countrySelect('regCountry')}</label></div></div><div class=row><button class="btn primary" id=regContinue>Continue</button><button class="btn ghost" id=regSignin>Already have an account?</button></div><p class=auth-note>No password. Lantern verifies your email with a one-time code and keeps you signed in on this device.</p><div id=regFb class=feedback></div>`);
  document.getElementById('regContinue').onclick=async()=>{const first=document.getElementById('regFirst').value.trim(),email=document.getElementById('regEmail').value.trim(),country=document.getElementById('regCountry').value,fb=document.getElementById('regFb');if(!first||!email||!country){fb.textContent='First name, email and country are required.';return}try{let d=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({first_name:first,email,country,mode:'signup'})});S.authDraft={first_name:first,email:d.email||email,country,mode:'signup'};S.screen='otp';render()}catch(e){fb.textContent=e.message}};
  document.getElementById('regSignin').onclick=()=>{S.screen='signin';render()}
}
function signin(){
  shell(`${logo()}<h1>Welcome back.</h1><p class=lead>Enter your email and Lantern will send you a one-time verification code.</p><input id=signinEmail type=email autocomplete=email placeholder="you@example.com"><div class=row><button class="btn primary" id=signinContinue>Send code</button><button class="btn ghost" id=signinCreate>Create account</button></div><div id=signinFb class=feedback></div>`);
  document.getElementById('signinContinue').onclick=async()=>{const email=document.getElementById('signinEmail').value.trim(),fb=document.getElementById('signinFb');try{let d=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({email,mode:'signin'})});S.authDraft={email:d.email||email,mode:'signin'};S.screen='otp';render()}catch(e){fb.textContent=e.message}};
  document.getElementById('signinCreate').onclick=()=>{S.screen='register';render()}
}
function otp(){
  const email=S.authDraft?.email||'your email';shell(`${logo()}<h1>Check your email.</h1><p class=lead>Enter the verification code sent to <strong>${escapeHtml(email)}</strong>.</p><input id=otpCode class=otp inputmode=numeric autocomplete=one-time-code maxlength=8 placeholder="••••••"><div class=row><button class="btn primary" id=otpVerify>Verify & Continue</button><button class="btn ghost" id=otpBack>Back</button></div><div id=otpFb class=feedback></div>`);
  document.getElementById('otpVerify').onclick=async()=>{const token=document.getElementById('otpCode').value.replace(/\s+/g,''),fb=document.getElementById('otpFb');try{let d=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({email:S.authDraft.email,token,guest_id:guestUid})});saveAuthSession(d);S.authDraft=null;await loadMe();S.screen='home';render()}catch(e){fb.textContent=e.message}};
  document.getElementById('otpBack').onclick=()=>{S.screen=S.authDraft?.mode==='signin'?'signin':'register';render()}
}
function account(){
  const p=S.me?.profile||{};shell(`${nav()}${logo()}<h1>${escapeHtml(p.first_name||'Your account')}</h1><div class=card><div class=meta>EMAIL</div><p>${escapeHtml(p.email||'')}</p><div class=meta>COUNTRY</div><p>${escapeHtml(p.country||'')}</p></div><button class="btn ghost" id=signOut>Sign out</button><div id=acctFb class=feedback></div>`);bindNav();
  document.getElementById('signOut').onclick=async()=>{try{await api('/api/auth/signout',{method:'POST',body:'{}'})}catch(e){}clearAuthSession();await loadMe();S.screen='home';render()}
}


function postValueRegister(){
  shell(`${logo()}<h1>This doesn’t have to be our first and last story.</h1><p class=lead>Make Lantern yours.</p><div class=row><button class="btn primary" id=makeYours>Create account</button><button class="btn ghost" id=notNow>Not now</button></div>`);
  document.getElementById('makeYours').onclick=()=>{S.screen='register';render()};
  document.getElementById('notNow').onclick=async()=>{await loadMe();S.screen='home';render()}
}
function adminLogin(){shell(`${logo()}<h1>Admin Test Access</h1><p class=lead>Internal Lantern testing only.</p><input id=adminTokenInput type=password placeholder="Admin test token"><div class=row><button class="btn primary" id=adminVerify>Unlock</button><button class="btn ghost" id=adminBack>Back</button></div><div id=adminFb class=feedback></div>`);document.getElementById('adminBack').onclick=()=>{S.screen='home';render()};document.getElementById('adminVerify').onclick=async()=>{const token=document.getElementById('adminTokenInput').value.trim(),previous=adminToken;if(!token)return;adminToken=token;try{let d=await api('/api/admin/verify',{method:'POST',body:'{}'});if(d.admin){localStorage.lantern_admin_token=token;await loadMe();S.screen='home';render()}else{adminToken=previous;document.getElementById('adminFb').textContent='Invalid admin token.'}}catch(e){adminToken=previous;document.getElementById('adminFb').textContent='Admin access could not be verified.'}}}
function adminPanel(){shell(`${nav()}${logo()}<h1>Alpha Admin Test</h1><p class=lead>Admin requests are unlimited. Simulate Guest, Free, or Paid state without changing normal caps for testers.</p><div class=card><div class=ey>SIMULATE PRODUCT STATE</div><div class=pills><button class=pill data-tier=guest>Guest</button><button class=pill data-tier=free>Free</button><button class=pill data-tier=paid>Paid</button></div><div id=adminState class=feedback></div></div><div class=card><div class=ey>VOICE AUDITION</div><p class=meta>Audition both candidate narrators with the same Lantern line before external Alpha.</p><div class=row><button class="btn ghost" id=previewFemale>Preview Female</button><button class="btn ghost" id=previewMale>Preview Male</button><button class="btn ghost" id=previewStop>Stop</button></div><div id=voicePreviewStatus class=feedback></div></div><button class="btn ghost" id=adminLogout>Lock admin tools</button>`);bindNav();document.querySelectorAll('[data-tier]').forEach(btn=>btn.onclick=async()=>{try{let d=await api('/api/admin/simulate-tier',{method:'POST',body:JSON.stringify({tier:btn.dataset.tier})});document.getElementById('adminState').textContent=d.ok?'Simulation set to '+btn.dataset.tier+'. Admin access itself remains unlimited.':'Could not change simulation.'}catch(e){document.getElementById('adminState').textContent='Could not change simulation.'}});const vpStatus=document.getElementById('voicePreviewStatus');const preview=async(choice)=>{const oldStory=S.story,oldProfile=S.profile;S.story={text:'Every person carries a story. Sometimes the right story arrives from somewhere we did not expect.'};S.profile={audio_style:'Warm, restrained, intimate storytelling. Natural pace. No announcer voice.'};await startNarration(choice,vpStatus,false);S.story=oldStory;S.profile=oldProfile};document.getElementById('previewFemale').onclick=()=>preview('female');document.getElementById('previewMale').onclick=()=>preview('male');document.getElementById('previewStop').onclick=()=>{stopNarration();vpStatus.textContent='Stopped.'};document.getElementById('adminLogout').onclick=()=>{adminToken='';delete localStorage.lantern_admin_token;S.screen='home';render()}}
function render(){({ritual,home,finding,clarify,story,quiet,library,prefs,limit,nomatch,register,signin,otp,account,postValueRegister,adminLogin,adminPanel,closed}[S.screen])()}render();
</script></body></html>
